<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/storage-encrypt.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | Where Is My Bus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  
  <style>
    body {
      margin: 0;
      height: 100dvh;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 0 32px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 32px 0;
      color: #000000;
    }

    .error-banner {
      background: #fde8e8;
      color: #c81e1e;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 24px;
      width: 100%;
      box-sizing: border-box;
      text-align: left;
    }
    .error-banner.hidden {
      display: none;
    }

    .google-btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      padding: 14px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      transition: background 0.2s ease;
      border: 1px solid #c5c5d2;
      cursor: pointer;
      gap: 12px;
    }

    .google-btn:hover {
      background: #ececf1;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      text-align: left;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 12px;
      color: #6e6e80;
    }

    .checkbox-container input {
      margin-top: 2px;
    }
    
    .back-link {
      font-size: 14px;
      color: #10a37f;
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="icons/icon-192.png" alt="WIMB Logo" />
    </div>
    
    <h1>Welcome back</h1>

    <div id="error-banner" class="error-banner hidden"></div>

    <label class="checkbox-container">
      <input type="checkbox" id="privacy-consent" checked>
      <span>I agree to the terms of service and privacy policy for Where Is My Bus.</span>
    </label>

    <button onclick="startGoogleSignIn(event)" class="google-btn">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
      Continue with Google
    </button>
    
    <a href="index.html" class="back-link">← Back to role selection</a>
  </div>

  <script>
    function startGoogleSignIn(e) {
      e.preventDefault();
      const consent = document.getElementById('privacy-consent');
      if (consent && !consent.checked) {
        const errBanner = document.getElementById('error-banner');
        errBanner.textContent = 'You must agree to the Privacy Policy to proceed.';
        errBanner.classList.remove('hidden');
        return;
      }
      const clientId = '47792284104-7dncvdit6ilh47snjfm8anekv3jvavko.apps.googleusercontent.com';
      const h = window.location.hostname;
      const redirectUri = (h === 'localhost' || h === '127.0.0.1' || h === '')
        ? 'http://localhost:3001/google-callback.html'
        : 'https://where-is-my-bus-639k.onrender.com/google-callback.html';
      
      const oidcUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=id_token&response_mode=form_post&scope=openid%20email%20profile&nonce=force_switch&prompt=select_account`;
      window.location.href = oidcUrl;
    }
  </script>
</body>
</html>
