<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | BusTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="js/icons.js?v=12"></script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BusTrack">
  <style>
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #020617; /* Very dark slate */
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Animated Glowing Orbs */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      animation: float 12s infinite ease-in-out alternate;
    }
    body::before {
      width: 50vw;
      height: 50vw;
      max-width: 600px;
      max-height: 600px;
      background: rgba(79, 70, 229, 0.25); /* Indigo glow */
      top: -10%;
      left: -10%;
    }
    body::after {
      width: 40vw;
      height: 40vw;
      max-width: 500px;
      max-height: 500px;
      background: rgba(236, 72, 153, 0.2); /* Pink glow */
      bottom: -10%;
      right: -10%;
      animation-delay: -6s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.1); }
    }

    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      box-sizing: border-box;
      max-width: 1000px;
      margin: 0 auto;
    }

    .landing-header {
      text-align: center;
      margin-bottom: 40px;
      flex-shrink: 0;
      animation: fadeDown 0.8s ease-out;
    }
    
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .landing-header .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: white;
      border-radius: 24px;
      font-size: 32px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.3);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .landing-header .logo:hover {
      transform: scale(1.1) rotate(-8deg);
    }

    .landing-header h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin: 0 0 12px 0;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .landing-header p {
      font-size: 17px;
      color: #94a3b8;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
      font-weight: 400;
    }

    .roles-wrapper {
      flex: 1;
      overflow-y: auto; /* Allow inner scrolling if needed */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
      padding-bottom: 32px;
    }
    .roles-wrapper::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .roles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      animation: fadeUp 0.8s ease-out 0.2s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .role-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px;
      text-decoration: none;
      color: #f8fafc;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .role-card:hover {
      transform: translateY(-8px) scale(1.02);
      background: rgba(40, 53, 76, 0.8);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .role-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, transparent);
      transition: all 0.4s ease;
      opacity: 0;
    }
    
    .role-card:hover::after {
      opacity: 1;
    }

    .role-card.student:hover::after { background: linear-gradient(90deg, #10b981, #34d399); }
    .role-card.faculty:hover::after { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .role-card.parent:hover::after { background: linear-gradient(90deg, #ec4899, #f472b6); }
    .role-card.driver:hover::after { background: linear-gradient(90deg, #4f46e5, #818cf8); }

    .role-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 20px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: rgba(15, 23, 42, 0.5);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05);
    }

    .role-card:hover .role-icon {
      transform: scale(1.15) translateY(-4px);
    }

    .student .role-icon { color: #34d399; }
    .faculty .role-icon { color: #a78bfa; }
    .parent .role-icon { color: #f472b6; }
    .driver .role-icon { color: #818cf8; }

    .role-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .role-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .main-container {
        padding: 24px 16px;
      }
      .landing-header h1 {
        font-size: 32px;
      }
      .landing-header {
        margin-bottom: 32px;
      }
      .roles-grid {
        grid-template-columns: 1fr; /* Switch to 1 column so cards are beautifully readable */
        gap: 16px;
      }
      .role-card {
        flex-direction: row; /* Horizontal layout for mobile */
        text-align: left;
        padding: 20px 24px;
        align-items: center;
      }
      .role-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 0;
        margin-right: 20px;
        flex-shrink: 0;
        font-size: 24px;
      }
      .role-card:hover .role-icon {
        transform: scale(1.1) translateX(4px);
      }
      .role-title {
        font-size: 18px;
        margin-bottom: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="landing-header">
      <div class="logo">

      </div>
      <h1>BusTrack</h1>
      <p>Choose your role to continue to the dashboard.</p>
    </div>

    <div class="roles-wrapper">
      <div class="roles-grid">
        <a href="student-login.html" class="role-card student">
          <div class="role-icon">
            <i class="fas fa-user-graduate"></i>
          </div>
          <div>
            <div class="role-title">Student</div>
            <div class="role-desc">Track your bus in real-time and get updates.</div>
          </div>
        </a>

        <a href="student-login.html" class="role-card faculty">
          <div class="role-icon">
            <i class="fas fa-chalkboard-teacher"></i>
          </div>
          <div>
            <div class="role-title">Faculty</div>
            <div class="role-desc">Sign in with Google for faculty access.</div>
          </div>
        </a>

        <a href="student-login.html" class="role-card parent">
          <div class="role-icon">
            <i class="fas fa-user-friends"></i>
          </div>
          <div>
            <div class="role-title">Parent</div>
            <div class="role-desc">Monitor commutes and receive live alerts.</div>
          </div>
        </a>

        <a href="driver-login.html" class="role-card driver">
          <div class="role-icon">
            <i class="fas fa-id-badge"></i>
          </div>
          <div>
            <div class="role-title">Driver</div>
            <div class="role-desc">Manage your route and broadcast location.</div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.warn('[BusTrack] Service Worker failed:', err));
      });
    }
  </script>
</body>
</html>
