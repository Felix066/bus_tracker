<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/storage-encrypt.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Where Is My Bus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .main-container {
      width: 100%;
      max-width: 400px;
      padding: 0 32px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 32px 0;
      color: #000000;
    }

    .role-btn {
      width: 100%;
      background: #10a37f;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .role-btn:hover {
      background: #0e906f;
    }

    .role-btn.secondary {
      background: #ffffff;
      color: #000000;
      border: 1px solid #c5c5d2;
    }

    .role-btn.secondary:hover {
      background: #ececf1;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      width: 100%;
      margin: 24px 0;
    }
    
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #c5c5d2;
    }
    
    .divider:not(:empty)::before { margin-right: .25em; }
    .divider:not(:empty)::after { margin-left: .25em; }

    .divider-text {
      color: #6e6e80;
      font-size: 12px;
      padding: 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* PWA Install Button */
    .install-pwa-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: none;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .install-pwa-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="logo">
      <img src="icons/icon-192.png" alt="WIMB Logo" />
    </div>
    
    <h1>Where Is My Bus</h1>

    <a href="student-login.html" class="role-btn">
      Continue as Student
    </a>
    
    <a href="student-login.html" class="role-btn secondary">
      Continue as Parent
    </a>
    
    <a href="student-login.html" class="role-btn secondary">
      Continue as Faculty
    </a>

    <div class="divider">
      <span class="divider-text">Fleet Management</span>
    </div>

    <a href="driver-login.html" class="role-btn secondary">
      Driver / Admin Portal
    </a>
  </div>

  <button id="install-btn" class="install-pwa-btn">
    <i class="fas fa-download"></i> Install App
  </button>

  <script>
    function isTokenExpired(token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return !payload || !payload.exp || (Date.now() / 1000) > payload.exp;
      } catch(e) {
        return true;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const userSession = JSON.parse(localStorage.getItem('userSession'));
      if (userSession && userSession.token && !isTokenExpired(userSession.token)) {
        window.location.href = 'student-dashboard.html';
      }

      const driverSession = JSON.parse(localStorage.getItem('driverSession'));
      if (driverSession && driverSession.token && !isTokenExpired(driverSession.token)) {
        // Just let them log in manually or redirect logic handled locally
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .catch((err) => console.warn('Service Worker failed:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.add('visible');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.classList.remove('visible');
      }
    });

    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      installBtn.classList.remove('visible');
    });
  </script>
</body>
</html>
