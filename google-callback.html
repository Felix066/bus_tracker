<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing In... | BusTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px -10px rgba(15,23,42,0.12);
      max-width: 380px;
      width: 90%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; font-weight: 500; line-height: 1.6; }
    .error-card { display: none; }
    .error-card h1 { color: #dc2626; }
    .retry-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: #2563eb;
      color: white;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="auth-card" id="loading-card">
    <div class="spinner"></div>
    <h1>Signing you in…</h1>
    <p>Please wait while we verify your Google account.<br>This only takes a moment.</p>
  </div>

  <div class="auth-card error-card" id="error-card">
    <h1>Sign-In Failed</h1>
    <p id="error-message">Something went wrong. Please try again.</p>
    <a href="student-login.html" class="retry-btn">Try Again</a>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // ============================================================================
    // GOOGLE REDIRECT CALLBACK HANDLER
    // ============================================================================
    // After Google Sign-In (redirect mode), Google posts the credential back here.
    // The Google Identity Services library fires the callback defined by
    // data-callback="handleGoogleCallback" with the credential object.
    // We then forward it to our backend for secure verification.
    // ============================================================================

    // Determine backend URL — same logic as supabase-client.js
    const BACKEND_URL = (window.location.hostname === 'localhost' ||
                         window.location.hostname === '127.0.0.1' ||
                         window.location.hostname === '')
      ? 'http://localhost:3001'
      : '';

    function showError(msg) {
      document.getElementById('loading-card').style.display = 'none';
      document.getElementById('error-card').style.display = 'block';
      document.getElementById('error-message').textContent = msg || 'Something went wrong. Please try again.';
    }

    // GIS calls this function after a successful redirect sign-in
    window.handleGoogleCallback = async function(response) {
      if (!response || !response.credential) {
        showError('No credential received from Google. Please try again.');
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: response.credential })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        // Store the session (role is always student or faculty — both go to student dashboard)
        localStorage.setItem('userSession', JSON.stringify({
          id: data.user.id,
          email: data.user.email,
          name: data.user.name || data.user.email,
          role: data.role,
          token: data.token
        }));

        // All Google-authenticated users (students & faculty) go to student dashboard
        window.location.replace('student-dashboard.html');

      } catch (err) {
        console.error('[GoogleCallback] Error:', err);
        showError(err.message || 'Authentication failed. Please try again.');
      }
    };

    // Fix login_uri for localhost — ensures the GIS library uses the correct
    // callback URL when running on a local dev server.
    (function() {
      const h = window.location.hostname;
      if (h === 'localhost' || h === '127.0.0.1' || h === '') {
        const el = document.getElementById('g_id_onload');
        if (el) {
          // For redirect mode from student-login.html, we don't need login_uri here
          // But if this page is loaded directly, ensure origin is correct
          console.log('[GoogleCallback] Running on localhost — backend:', BACKEND_URL);
        }
      }
    })();
  </script>

  <!-- Google Identity Services — loaded AFTER our callback is defined -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- GIS configuration div for the redirect callback -->
  <div id="g_id_onload"
       data-client_id="47792284104-7dncvdit6ilh47snjfm8anekv3jvavko.apps.googleusercontent.com"
       data-callback="handleGoogleCallback"
       data-auto_prompt="false">
  </div>
</body>
</html>
