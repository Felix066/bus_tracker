<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Where Is My Bus</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts for modern typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/leaflet.css?v=12">
<link rel="manifest" href="/manifest.json">
<!-- BEGIN: Custom Map Styles -->
<style data-purpose="custom-map-layer">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #cbd5e1;
    }
    
    /* Floating card shadow replication */
    .sheet-shadow {
      box-shadow: 0 -8px 25px -4px rgba(0, 0, 0, 0.08), 0 -4px 10px -2px rgba(0, 0, 0, 0.04);
    }
    
    .hidden { display: none !important; }
</style>
<!-- END: Custom Map Styles -->
</head>
<body class="flex justify-center items-center h-[100dvh] bg-slate-200 m-0 p-0 sm:py-6 select-none overflow-hidden">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[420px] h-full sm:h-[844px] bg-[#a8d3e6] overflow-hidden flex flex-col sm:rounded-[36px] sm:shadow-2xl border-0 sm:border-[8px] sm:border-slate-800">

<!-- Hidden offline indicator -->
<div id="offline-indicator" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1A1A1A; color:white; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:500; z-index:9999; box-shadow:0 4px 20px rgba(0,0,0,0.3); align-items:center; gap:8px;">
  You are offline - showing cached data
</div>

<!-- BEGIN: MainHeader -->
<header class="relative z-30 bg-white/95 backdrop-blur-md px-4 pt-3.5 pb-3 flex items-center justify-between shadow-sm border-b border-gray-100 flex-shrink-0">
  <!-- App Brand Logo & Title -->
  <div class="flex items-center space-x-2.5 cursor-pointer" onclick="window.location.href='student-dashboard.html'">
    <!-- Stylized "W" logo -->
    <div class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-800">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewbox="0 0 32 32">
        <path d="M4 10 L8.5 22 L13 13 L17.5 22 L22 13 L26.5 22 L30 10"></path>
      </svg>
    </div>
    <h1 class="text-xl font-bold tracking-tight text-gray-900 leading-none">Where Is My Bus</h1>
  </div>
  <!-- Action items: Bus tag -->
  <div class="flex items-center space-x-2">
    <span id="assigned-bus-label" class="px-2.5 py-1 text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full cursor-pointer" onclick="studentLogout()">
      Bus 1
    </span>
  </div>
</header>
<!-- END: MainHeader -->

<!-- BEGIN: MapView -->
<main class="relative flex-1 w-full overflow-hidden bg-[#a6cfe2]" data-purpose="interactive-map">
  <!-- Leaflet Map Container (replaces static SVG map to wire up real tracking logic) -->
  <div id="map" class="absolute inset-0 w-full h-full z-0"></div>
</main>
<!-- END: MapView -->

<!-- BEGIN: BottomSheetStatusCard -->
<section class="relative z-30 bg-white rounded-t-[32px] px-5 pt-3 pb-7 sheet-shadow -mt-6 flex-shrink-0" data-purpose="bus-status-sheet">
  <!-- Top Center Drag Handle -->
  <div class="flex justify-center w-full mb-2">
    <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
  </div>
  
  <!-- Live GPS Tracking Active Pill Badge -->
  <div class="flex justify-center -mt-1 mb-4">
    <span class="inline-flex items-center px-4 py-1.5 rounded-full text-[11px] font-extrabold tracking-wider text-white bg-[#1e6f43] uppercase shadow-sm">
      LIVE GPS TRACKING ACTIVE
    </span>
  </div>
  
  <!-- Status Header: STOPPED -->
  <div class="flex items-center space-x-3 mb-4">
    <div id="status-icon" class="w-10 h-10 rounded-xl bg-amber-500/10 border-2 border-amber-600 flex items-center justify-center text-amber-600 stopped">
      <svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24">
        <!-- Raised palm icon -->
        <path d="M12 2a1 1 0 0 1 1 1v7a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm3 3a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0V6a1 1 0 0 1 1-1zm3 3a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0V9a1 1 0 0 1 1-1zM9 5a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0V6a1 1 0 0 1 1-1zm-3 4a1 1 0 0 1 1 1v3a1 1 0 0 1-2 0v-3a1 1 0 0 1 1-1zm1 7a5 5 0 0 0 10 0v-3h-2v3a3 3 0 0 1-6 0v-3H7v3z"></path>
      </svg>
    </div>
    <h2 id="bus-status-display" class="text-2xl font-black text-gray-950 tracking-tight">STOPPED</h2>
  </div>
  
  <!-- Location Info -->
  <div class="flex items-center space-x-2.5 mb-4 text-gray-800">
    <svg class="w-5 h-5 text-slate-500 shrink-0" fill="currentColor" viewbox="0 0 20 20">
      <path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
    </svg>
    <span id="location-display" class="font-bold text-gray-900 text-sm tracking-tight truncate searching">
      Searching...
    </span>
  </div>
  
  <!-- Metrics Row (Speed & Timer) -->
  <div class="grid grid-cols-2 gap-4 pb-2 border-gray-100">
    <!-- Speed Metric -->
    <div class="flex items-center space-x-2.5">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
        <path d="M12 8v4l2.5 2.5M12 2a10 10 0 100 20 10 10 0 000-20z" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M12 6a6 6 0 016 6" stroke-linecap="round"></path>
      </svg>
      <span id="speed-display" class="font-bold text-gray-900 text-base">0 km/h</span>
    </div>
    <!-- Stopwatch Metric -->
    <div class="flex items-center space-x-2.5">
      <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
        <circle cx="12" cy="13" r="8"></circle>
        <path d="M12 9v4l2 2m-2-11V2m-4 1h8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span id="trip-duration-display" class="font-bold text-gray-900 text-base">00:00:00</span>
    </div>
  </div>

  <!-- Bus to You (Your Location) Card -->
  <div class="bg-[#f5f5f9] rounded-2xl p-3.5 mt-2 relative overflow-hidden" data-purpose="distance-card">
    <!-- Card Header -->
    <div class="flex justify-between items-center mb-1">
      <span class="text-[11px] font-bold tracking-wider text-gray-600 uppercase">
        BUS TO YOU (YOUR LOCATION)
      </span>
      <!-- Sparkles Icon -->
      <svg class="w-4 h-4 text-indigo-400 opacity-60" fill="currentColor" viewbox="0 0 24 24">
        <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"></path>
      </svg>
    </div>
    <!-- Away text -->
    <div id="road-student-status" class="text-lg font-bold text-gray-900 leading-tight mb-2.5">
      Away
    </div>
    <!-- Progress bar and distance indicator -->
    <div class="flex items-center space-x-3">
      <span id="road-dist-student" class="text-sm font-semibold text-gray-900 whitespace-nowrap">
        Share location for distance
      </span>
      <!-- Track bar -->
      <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden flex">
        <div id="proximity-progress" class="w-[0%] h-full bg-[#4f56c7] rounded-full transition-all duration-500"></div>
        <div class="flex-1 h-full"></div>
      </div>
    </div>
  </div>
</section>
<!-- END: BottomSheetStatusCard -->

</div>
<!-- END: MobileDeviceFrame -->

<!-- Hidden elements for JS compatibility -->
<div class="hidden">
  <span id="next-stop-display"></span>
  <div id="road-eta-dest">Loading...</div>
  <div id="road-dist-dest"><span id="dest-name-display">—</span></div>
  <div id="road-source-badge">ROAD</div>
  <div id="road-bus-status-dot"></div>
  <div id="road-bus-status">Connecting...</div>
  <div id="road-speed-display"></div>
  <div id="road-avg-speed"></div>
  <div id="road-last-gps"></div>
  <div id="dest-eta-card"></div>
  <div id="driver-name-display"></div>
  <div id="trip-status-bar"><span id="trip-status-text"></span></div>
</div>

<!-- Base Tracking Logic Scripts -->
<script src="js/leaflet.js?v=12"></script>
<script src="js/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/haversine.js"></script>
<script src="js/routes.js"></script>
<script src="js/map.js?v=12"></script>
<script src="js/location.js"></script>
<script src="js/gps.js"></script>
<script src="js/timer.js"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/session-protection.js"></script>
<script src="js/road-eta.js"></script>
<script src="js/student-console.js"></script>

<script>
  // Simple logout connected to the Bus 1 badge
  function studentLogout() {
    localStorage.removeItem('userSession');
    window.location.href = 'index.html';
  }

  protectRoute('student');
  const session = JSON.parse(localStorage.getItem('userSession'));
  if (!session) window.location.href = 'index.html';
</script>

<script>
  // Update Bus Status UI to seamlessly switch between STOPPED (amber) and MOVING (emerald) Tailwind classes
  function updateBusStatusUI(speedKmh) {
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('bus-status-display');

    if (speedKmh > 2) {
      if (statusIcon) {
        statusIcon.innerHTML = '🚌';
        statusIcon.className = 'w-10 h-10 rounded-xl bg-emerald-500/10 border-2 border-emerald-600 flex items-center justify-center text-emerald-600 text-xl moving';
      }
      if (statusText) statusText.textContent = 'MOVING';
    } else {
      if (statusIcon) {
        statusIcon.innerHTML = '<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a1 1 0 0 1 1 1v7a1 1 0 0 1-2 0V3a1 1 0 0 1 1-1zm3 3a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0V6a1 1 0 0 1 1-1zm3 3a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0V9a1 1 0 0 1 1-1zM9 5a1 1 0 0 1 1 1v5a1 1 0 0 1-2 0V6a1 1 0 0 1 1-1zm-3 4a1 1 0 0 1 1 1v3a1 1 0 0 1-2 0v-3a1 1 0 0 1 1-1zm1 7a5 5 0 0 0 10 0v-3h-2v3a3 3 0 0 1-6 0v-3H7v3z"></path></svg>';
        statusIcon.className = 'w-10 h-10 rounded-xl bg-amber-500/10 border-2 border-amber-600 flex items-center justify-center text-amber-600 stopped';
      }
      if (statusText) statusText.textContent = 'STOPPED';
    }
  }

  // Hook into speed display text updates
  const speedObs = new MutationObserver(() => {
    const speedEl = document.getElementById('speed-display');
    if (speedEl) {
      const val = parseFloat(speedEl.textContent) || 0;
      updateBusStatusUI(val);
    }
  });
  const speedTarget = document.getElementById('speed-display');
  if (speedTarget) {
    speedObs.observe(speedTarget, { childList: true, characterData: true, subtree: true });
  }

  // Update proximity progress bar based on road-dist-student content
  const distObs = new MutationObserver(() => {
    const distEl = document.getElementById('road-dist-student');
    const progressEl = document.getElementById('proximity-progress');
    if (distEl && progressEl) {
      const text = distEl.textContent;
      const match = text.match(/([\d.]+)\s*km/i);
      if (match) {
        const distKm = parseFloat(match[1]);
        // Scale: 0 km = 100%, 50+ km = 5%
        const pct = Math.max(5, Math.min(100, 100 - (distKm / 50 * 95)));
        progressEl.style.width = pct + '%';
      }
    }
  });
  const distTarget = document.getElementById('road-dist-student');
  if (distTarget) {
    distObs.observe(distTarget, { childList: true, characterData: true, subtree: true });
  }
</script>

<script>
window.addEventListener('online', () => {
  document.getElementById('offline-indicator').style.display = 'none';
});
window.addEventListener('offline', () => {
  document.getElementById('offline-indicator').style.display = 'flex';
});
if (!navigator.onLine) {
  document.getElementById('offline-indicator').style.display = 'flex';
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>

</body>
</html>
