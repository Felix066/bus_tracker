<!DOCTYPE html>
<html lang="en">
<head>
  <script src="js/storage-encrypt.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver/Admin Portal | Where Is My Bus</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ffffff">
  
  <style>
    body {
      margin: 0;
      height: 100dvh;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 0 32px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 32px 0;
      color: #000000;
    }

    .error-banner {
      background: #fde8e8;
      color: #c81e1e;
      padding: 12px;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 24px;
      width: 100%;
      box-sizing: border-box;
      text-align: left;
    }
    .error-banner.hidden {
      display: none;
    }
    
    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #c5c5d2;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .input-field:focus {
      border-color: #10a37f;
    }

    .login-btn {
      width: 100%;
      background: #10a37f;
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0e906f;
    }

    .login-btn:disabled {
      background: #88d1bf;
      cursor: not-allowed;
    }

    .back-link {
      font-size: 14px;
      color: #10a37f;
      text-decoration: none;
      font-weight: 500;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="icons/icon-192.png" alt="WIMB Logo" />
    </div>
    
    <h1>Welcome back</h1>

    <div id="error-banner" class="error-banner hidden"></div>

    <form id="driver-login-form" style="width: 100%;">
      <input type="password" id="pin-input" class="input-field" placeholder="Enter PIN" required autocomplete="current-password" pattern="[0-9]*" inputmode="numeric">
      
      <button type="submit" id="login-btn" class="login-btn">
        Continue
      </button>
    </form>
    
    <a href="index.html" class="back-link">← Back to role selection</a>
  </div>

  <script src="js/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/driver-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('driver-login-form');
      const pinInput = document.getElementById('pin-input');
      const errorBanner = document.getElementById('error-banner');
      const loginBtn = document.getElementById('login-btn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const pin = pinInput.value.trim();
          
          if (!pin) {
            errorBanner.textContent = 'Please enter a PIN';
            errorBanner.classList.remove('hidden');
            return;
          }

          errorBanner.classList.add('hidden');
          loginBtn.disabled = true;
          loginBtn.textContent = 'Verifying...';
          
          try {
            await window.driverAuth.login(pin);
            // Redirection happens in driverAuth
          } catch (err) {
            errorBanner.textContent = err.message || 'Invalid PIN';
            errorBanner.classList.remove('hidden');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Continue';
            pinInput.value = '';
            pinInput.focus();
          }
        });
      }
    });
  </script>
</body>
</html>
