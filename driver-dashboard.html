<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
<div id="offline-indicator" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1A1A1A; color:white; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:500; font-family:Inter,sans-serif; z-index:9999; box-shadow:0 4px 20px rgba(0,0,0,0.3); align-items:center; gap:8px;">
  You are offline - showing cached data
</div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="brand" style="display: flex; align-items: center; gap: 8px;">

      <span>BusTrack <em>Driver Console</em></span>
    </div>

    <button class="start-btn" id="start-btn" onclick="startTrip()">Start Trip</button>
    <button class="logout-btn" onclick="driverLogout()" style="margin-left: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </nav>

  <!-- STAT CARDS — 3 cards, Next Stop hidden for JS only -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Speed</div>
      <div class="stat-value" id="speed-display">0.0 km/h</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Duration</div>
      <div class="stat-value" id="trip-duration-display">00:00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current Position</div>
      <div class="stat-value searching" id="location-display">Searching...</div>
    </div>
  </div>

  <!-- Hidden next stop for JS reference — not visible on page -->
  <span id="next-stop-display" style="display:none;"></span>

  <!-- TRIP STATUS BAR — shows when trip is active -->
  <div class="trip-status-bar" id="trip-status-bar">
    <div class="status-dot-green"></div>
    <span id="trip-status-text">Trip active — GPS tracking live</span>
  </div>

  <!-- MAP -->
  <div class="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- SOS BUTTON -->
  <button id="sos-btn" onclick="triggerSOS()" style="position:fixed; bottom:40px; right:20px; background:#ef4444; color:white; border:none; padding:15px 25px; border-radius:30px; font-weight:bold; font-size:16px; box-shadow:0 10px 20px rgba(239,68,68,0.4); z-index:9999; cursor:pointer; display:flex; gap:10px; align-items:center;">
    <i class="fas fa-exclamation-triangle"></i> SOS EMERGENCY
  </button>

  <!-- CHAT PANEL -->
  <button id="chat-toggle-btn" onclick="toggleChat()" style="position:fixed; bottom:110px; right:20px; background:#4f46e5; color:white; border:none; width:56px; height:56px; border-radius:50%; font-size:24px; box-shadow:0 10px 20px rgba(79, 70, 229, 0.3); z-index:9999; cursor:pointer; display:flex; justify-content:center; align-items:center;">
    <i class="fas fa-comment-dots"></i>
    <span id="chat-badge" style="display:none; position:absolute; top:-2px; right:-2px; background:#ef4444; width:16px; height:16px; border-radius:50%; font-size:10px; font-weight:bold; align-items:center; justify-content:center;">!</span>
  </button>

  <div id="chat-panel" style="position:fixed; bottom:180px; right:20px; width:320px; height:400px; background:rgba(255,255,255,0.95); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.9); border-radius:24px; box-shadow:0 15px 35px rgba(15,23,42,0.15); z-index:9998; display:none; flex-direction:column; overflow:hidden; transition:all 0.3s ease;">
    <div style="background:#0f172a; color:white; padding:16px 20px; font-weight:700; font-size:15px; display:flex; justify-content:space-between; align-items:center;">
      <span>Dispatcher Chat</span>
      <button onclick="toggleChat()" style="background:none; border:none; color:#cbd5e1; cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="chat-messages" style="flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; font-size:13px; font-family:'Inter',sans-serif;">
      <div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:20px;">No messages yet.</div>
    </div>
    <div style="padding:16px; border-top:1px solid #e2e8f0; display:flex; gap:8px; background:white;">
      <input type="text" id="chat-input" placeholder="Type a message..." style="flex:1; padding:10px 14px; border:1px solid #e2e8f0; border-radius:12px; outline:none; font-family:'Inter',sans-serif; font-size:13px;">
      <button onclick="sendChatMessage()" style="background:#4f46e5; color:white; border:none; border-radius:12px; width:40px; height:40px; cursor:pointer; display:flex; align-items:center; justify-content:center;"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>


  <script src="js/leaflet.js?v=12"></script>
  <script src="js/supabase.min.js"></script>
  <script src="js/supabase-client.js?v=5"></script>
  <script src="js/haversine.js"></script>
  <script src="js/kalman.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/map.js?v=12"></script>
  <script src="js/location.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/trip.js?v=2"></script>
  <script src="js/sync.js?v=5"></script>
  <script src="js/driver-auth.js?v=5"></script>
  <script src="js/session-protection.js"></script>
  <script src="js/chat.js"></script>

  <script>
    protectRoute('driver');
    const driver = JSON.parse(localStorage.getItem('driverSession'));
    if (!driver || !driver.driverId) window.location.href = 'driver-login.html';

    // Make initChat accessible inside trip.js or call it when trip starts.
    // We will patch startTrip in trip.js if needed, or we can listen for trip start events.
    // For now, we'll patch startTrip here, but it's defined in trip.js. 
    // We will update trip.js to call initChat.


    // UPDATE 8 — Driver Bus Assignment Restriction
    function lockBusToDriver() {
      const session     = JSON.parse(localStorage.getItem('driverSession'));
      const assignedBus = session.assignedBus || session.busId; // fallback to busId if assignedBus not set

      const select = document.getElementById('bus-select');
      if (select && assignedBus) {
        // Clear and add only the assigned bus
        select.innerHTML = `<option value="${assignedBus}">${assignedBus}</option>`;
        select.value     = assignedBus;
        select.disabled  = true;
      }
      
      if (assignedBus) {
        const label = document.getElementById('assigned-bus-label');
        if (label) label.textContent = assignedBus;
      }
    }

    const driverNameDisplay = document.getElementById('driver-name-display');
    if (driverNameDisplay) driverNameDisplay.textContent = driver.username;
    lockBusToDriver();
    
    // Initialize real-time chat with dispatcher
    if (driver.assignedBus || driver.busId) {
      initChat(driver.assignedBus || driver.busId, 'driver');
    }

    // Init map defaults
    const defaultType = 'morning';
    initMap(defaultType);
    
    // Get immediate location so the map isn't empty before starting the trip
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const busLabel = driver.assignedBus ? driver.assignedBus.replace(/bus\s*/i, 'B').toUpperCase() : 'BUS';
            if (typeof updateBusMarker === 'function') {
                updateBusMarker(lat, lon, busLabel);
            }
        }, () => {}, { timeout: 10000 });
    }

    // Removed shift change dropdown logic as it's no longer needed

    // Subscribe to realtime location updates for map/chart synchronization
    if (driver && (driver.assignedBus || driver.busId)) {
      subscribeToBus(driver.assignedBus || driver.busId, defaultType);
    }

    // UPDATE 13 — Trip Recovery After Page Refresh
    if (typeof recoverActiveTrip === 'function') {
      recoverActiveTrip();
    }
  </script>

<script>
window.addEventListener('online', () => {
  document.getElementById('offline-indicator').style.display = 'none';
  console.log('[Network] Back online');
});

window.addEventListener('offline', () => {
  document.getElementById('offline-indicator').style.display = 'flex';
  console.log('[Network] Gone offline');
});

if (!navigator.onLine) {
  document.getElementById('offline-indicator').style.display = 'flex';
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => {
        console.log('[BusTrack] Service Worker registered:', reg.scope);
      })
      .catch((err) => {
        console.warn('[BusTrack] Service Worker failed:', err);
      });
  });
}

// Ensure offline on unload and maintain heartbeat
(function() {
  const driverSession = JSON.parse(localStorage.getItem('driverSession'));
  const activeBus = driverSession ? (driverSession.assignedBus || driverSession.busId) : null;
  const token = driverSession ? driverSession.token : null;
  
  if (driverSession && activeBus && token) {
    window.addEventListener('beforeunload', () => {
      // Fire-and-forget offline status update
      fetch(`${BACKEND_URL}/api/auth/logout-driver`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
    });

    const sendHeartbeat = () => {
      if (navigator.onLine) {
        fetch(`${BACKEND_URL}/api/trip/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ bus_id: activeBus })
        });
      }
    };

    // Run immediately, then every 30 seconds to be more responsive
    sendHeartbeat();
    setInterval(sendHeartbeat, 30000);
  }
})();
</script>
</body>
</html>
