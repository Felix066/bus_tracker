<!DOCTYPE html>
<html>
<head>
  <script src="js/storage-encrypt.js"></script>

  <meta http-equiv="refresh" content="0; url=admin-dashboard.html">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
    const adminSession = (() => {
      try { return JSON.parse(sessionStorage.getItem('adminSession')); } catch(e) { return null; }
    })();
    if (adminSession && adminSession.token) {
      window.location.replace("admin-dashboard.html?nocache=" + new Date().getTime());
    } else {
      window.location.replace("admin-login.html");
    }
  </script>
</head>
<body>Redirecting to Admin Portal...</body>
</html>
