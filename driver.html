<!DOCTYPE html>
<html>
<head>
  <script src="js/storage-encrypt.js"></script>

  <meta http-equiv="refresh" content="0; url=driver-login.html">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
    const driverSession = (() => {
      try { return JSON.parse(localStorage.getItem('driverSession')); } catch(e) { return null; }
    })();
    if (driverSession && driverSession.token) {
      window.location.replace("driver-dashboard.html?nocache=" + new Date().getTime());
    } else {
      window.location.replace("driver-login.html");
    }
  </script>
</head>
<body>Redirecting to Driver Portal...</body>
</html>
